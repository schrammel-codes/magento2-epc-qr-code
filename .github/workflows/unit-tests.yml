name: Unit Tests

on:
  pull_request:
    branches:
      - develop-2.x
      - 'release-*'

jobs:
  phpunit:
    name: "Magento ${{ matrix.magento-version }} / PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - magento-version: "2.4.6"
            magento-framework: "103.0.6"
            php-version: "8.1"
            coverage: false

          - magento-version: "2.4.7"
            magento-framework: "103.0.7"
            php-version: "8.2"
            coverage: false

          - magento-version: "2.4.8"
            magento-framework: "103.0.8"
            php-version: "8.3"
            coverage: false

          - magento-version: "2.4.9"
            magento-framework: "103.0.9"
            php-version: "8.4"
            coverage: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, dom, simplexml
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      # Secrets are not available for pull requests from forks, so the
      # authenticated repo.magento.com cannot be used. The Mage-OS mirror
      # provides the same magento/* packages without authentication.
      - name: Use Mage-OS mirror instead of repo.magento.com
        run: |
          jq --indent 4 '.repositories = [{"type": "composer", "url": "https://mirror.mage-os.org/"}]' composer.json > composer.json.tmp
          mv composer.json.tmp composer.json

      - name: Validate composer.json
        run: composer validate

      - name: Pin magento/framework version
        run: |
          composer require \
            --no-update \
            "magento/framework:${{ matrix.magento-framework }}"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Magento factory classes
        run: composer generate

      - name: Run PHPUnit
        run: >-
          vendor/bin/phpunit --testdox
          ${{ matrix.coverage && '--coverage-clover coverage.xml --log-junit junit.xml' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: ${{ !github.event.pull_request.head.repo.fork }}

      - name: Upload test results to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: ${{ !github.event.pull_request.head.repo.fork }}
